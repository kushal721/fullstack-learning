# Runs on every pull request and every push to main.
# A PR can only be merged when both jobs pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets you run CI by hand from the Actions tab (e.g. if a push was missed).
  workflow_dispatch:

# A new push to the same branch cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Fail on known high/critical vulnerabilities (see CONTRIBUTING).
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build

  browser:
    name: Browser check (${{ matrix.shard }}/3)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Split across three runners: every module part is a page checked in
    # three views, so one runner can't keep up as the course grows.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The browser is ~150 MB: keep it between runs, keyed by the
      # Playwright version in the lockfile.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Every page at 375px light, 375px dark and 1280px light (see
      # CONTRIBUTING): overflow, exactly one <h1>, no JavaScript errors.
      - run: npm run check:browser -- --shard=${{ matrix.shard }}/3

      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-failures-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  docker:
    name: Docker image builds
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
