# Runs on every pull request and every push to main.
# A PR can only be merged when both jobs pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets you run CI by hand from the Actions tab (e.g. if a push was missed).
  workflow_dispatch:

# A new push to the same branch cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Fail on known high/critical vulnerabilities (see CONTRIBUTING).
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
