# Publishes the Docker image after CI has passed on main.
# Image: ghcr.io/kushal721/fullstack-learning, tagged with the commit (sha-<short>) and latest.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Never publish two releases at the same time; finish them in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image
    # Only after a successful CI run for a push to main (not for pull requests).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit that CI checked.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
