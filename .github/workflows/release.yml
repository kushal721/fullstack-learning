# After CI has passed on main: publish the Docker image, then deploy it to Render.
# Image: ghcr.io/kushal721/fullstack-learning, tagged with the commit (sha-<short>) and latest.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Publish the current main by hand from the Actions tab.
  workflow_dispatch:

# Never publish two releases at the same time; finish them in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image
    # Only after a successful CI run for a push to main (not for pull requests).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - id: commit
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          # Build exactly the commit that CI checked.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    needs: publish
    # Skipped until the Render service exists (repo variable RENDER_SERVICE_URL).
    if: vars.RENDER_SERVICE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    env:
      SHA: ${{ needs.publish.outputs.sha }}
      SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Ask Render to deploy this exact image
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Repository secret RENDER_DEPLOY_HOOK_URL is not set."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY}:sha-${SHA:0:7}"
          echo "Deploying $image"
          curl -fsS -X POST --get "$DEPLOY_HOOK" --data-urlencode "imgURL=$image" > /dev/null

      # The deploy is only done when the live site reports the new commit.
      - name: Wait until the new version is live
        run: |
          for attempt in $(seq 1 60); do
            version=$(curl -fsS "$SERVICE_URL/api/health" | jq -r '.version' || true)
            if [ "$version" = "$SHA" ]; then
              echo "Live: $SERVICE_URL is running $SHA"
              exit 0
            fi
            echo "Waiting ($attempt/60): live version is ${version:-unreachable}"
            sleep 10
          done
          echo "::error::$SERVICE_URL did not report version $SHA within 10 minutes."
          exit 1
